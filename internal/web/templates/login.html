<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · doot</title>
<link rel="manifest" href="{{app "/manifest.webmanifest"}}">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="doot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="{{app "/static/icon-192.png"}}">
<link rel="apple-touch-icon" href="{{app "/static/icon-192.png"}}">
<link rel="stylesheet" href="{{app "/static/app.css"}}">
</head>
<body class="centered">

<main class="gate">
  <h1 class="gate-mark">doot</h1>
  <p class="muted">Sign in to continue.</p>

  {{if .Error}}<p class="banner banner-err">{{.Error}}</p>{{end}}

  <form method="post" action="{{app "/login"}}" class="stack">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text"
             autocomplete="username" autocapitalize="none" autocorrect="off"
             required autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</main>

</body>
</html>
